<!DOCTYPE html>
<html>

  <head>
    <meta charset="UTF-8" />
    <title>My MTG Collection</title>
    <style>
      body {
        font-family: Aptos, sans-serif;
        padding: 24px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 16px;
      }

      .card {
        background: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
      }

      .card-name {
        font-weight: bold;
        margin-bottom: 4px;
      }

      .card-type {
        color: #666;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <h1>My MTG Collection</h1>
    <p>Commander card tracker — <span id="cardCount">0</span> cards in your collection</p>

    <div class="card-grid" id="cardGrid"></div>

    <div id="progressContainer" style="display:none; margin:16px 0;">
  <div style="font-size:14px; color:#666; margin-bottom:6px;" id="progressText">Importing...</div>
  <div style="background:#ddd; border-radius:8px; height:12px; width:100%;">
    <div id="progressBar" style="background:#4a90d9; height:12px; border-radius:8px; width:0%; transition:width 0.3s;"></div>
  </div>
</div>

   <input type="text" id="cardInput" placeholder="Card name..." />
   <input type="text" id="deckInput" placeholder="Deck name (e.g. Atraxa)..." />
   <button onclick="addCard()">Add card</button>

   <input type="file" id="fileInput" accept=".txt" />
<button onclick="importDeck()">Import deck</button>

    <script>
let collection = JSON.parse(localStorage.getItem("mtgCollection")) || [];

function saveCollection() {
  localStorage.setItem("mtgCollection", JSON.stringify(collection));
}

function displayCards() {
  let grid = document.getElementById("cardGrid");
  grid.innerHTML = "";
  document.getElementById("cardCount").textContent = collection.length;

  let decks = {};
 collection.forEach(function(card, index) {
    let deckName = card.deck || "Unsorted";
    if (!decks[deckName]) {
      decks[deckName] = [];
    }
    decks[deckName].push({ card, index });
  });

  Object.keys(decks).forEach(function(deckName) {
    let deckHeader = document.createElement("h2");
deckHeader.textContent = deckName + " (" + decks[deckName].length + " cards)";
deckHeader.style.cssText = "margin-top:24px; margin-bottom:12px; font-size:18px;";
grid.appendChild(deckHeader);

    let deckGrid = document.createElement("div");
    deckGrid.className = "card-grid";
    grid.appendChild(deckGrid);

    decks[deckName].forEach(function({ card, index }) {
      let newCard = document.createElement("div");
      newCard.className = "card";
      newCard.innerHTML = `
        <img src="${card.image}" style="width:100%; border-radius:4px;" />
        <div class="card-name">${card.name}</div>
        <div class="card-type">${card.type}</div>
        <button onclick="removeCard(${index})" style="margin-top:8px; width:100%;">Remove</button>
      `;
      deckGrid.appendChild(newCard);
    });
  });
}

async function addCard() {
  let cardName = document.getElementById("cardInput").value;

  if (cardName === "") {
    alert("Please type a card name first!");
    return;
  }

  let response = await fetch("https://api.scryfall.com/cards/named?fuzzy=" + cardName);
  let card = await response.json();

  collection.push({
    name: card.name,
    type: card.type_line,
    image: card.image_uris.normal,
    deck: document.getElementById("deckInput").value || "Unsorted"
  });

  saveCollection();
  displayCards();
  document.getElementById("cardInput").value = "";
}

function removeCard(index) {
  collection.splice(index, 1);
  saveCollection();
  displayCards();
}

displayCards();

async function importDeck() {
  let deckName = document.getElementById("deckInput").value.trim();

  if (!deckName) {
    alert("Please type a deck name before importing!");
    return;
  }

  let file = document.getElementById("fileInput").files[0];

  if (!file) {
    alert("Please select a txt file first!");
    return;
  }

  let text = await file.text();
  let lines = text.split("\n");

  let inMaybeboard = false;
  let cardLines = lines.filter(function(line) {
    let trimmed = line.trim();
    if (trimmed.startsWith("// MAYBEBOARD")) {
      inMaybeboard = true;
    }
    if (trimmed === "" || trimmed.startsWith("// ")) return false;
    if (inMaybeboard) return false;
    return true;
  });

  let identifiers = [];
  cardLines.forEach(function(line) {
    let isFoil = line.includes("*F*");
    let cleaned = line.replace(/\*F\*/g, "").trim();
    let match = cleaned.match(/^(\d+)\s+(.+?)\s+\([A-Z0-9]+\)/);
    if (match) {
      let quantity = parseInt(match[1]);
      let cardName = match[2].trim();
      for (let i = 0; i < quantity; i++) {
        identifiers.push({ name: cardName, foil: isFoil });
      }
    }
  });

  let chunks = [];
  for (let i = 0; i < identifiers.length; i += 75) {
    chunks.push(identifiers.slice(i, i + 75));
  }

  let progressContainer = document.getElementById("progressContainer");
  let progressBar = document.getElementById("progressBar");
  let progressText = document.getElementById("progressText");

  progressContainer.style.display = "block";
  progressBar.style.width = "0%";
  progressText.textContent = "Starting import of " + identifiers.length + " cards into " + deckName + "...";

  let allCards = [];
  let notFound = [];
  let processed = 0;

  for (let chunk of chunks) {
    let response = await fetch("https://api.scryfall.com/cards/collection", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ identifiers: chunk })
    });

    let data = await response.json();
    allCards = allCards.concat(data.data);

    if (data.not_found) {
      notFound = notFound.concat(data.not_found);
    }

    processed += chunk.length;
    let percent = Math.round((processed / identifiers.length) * 100);
    progressBar.style.width = percent + "%";
    progressText.textContent = "Imported " + processed + " of " + identifiers.length + " cards...";

    await new Promise(r => setTimeout(r, 200));
  }

  allCards.forEach(function(card) {
    let imageUri = card.image_uris
      ? card.image_uris.normal
      : card.card_faces[0].image_uris.normal;

    let identifier = identifiers.find(id => id.name === card.name);
    collection.push({
      name: card.name,
      type: card.type_line,
      image: imageUri,
      deck: deckName,
      foil: identifier ? identifier.foil : false
    });
  });

  progressText.textContent = notFound.length > 0
    ? "Import complete! " + allCards.length + " cards added. " + notFound.length + " not found."
    : "Import complete! All " + allCards.length + " cards added to " + deckName + ".";
  progressBar.style.width = "100%";

  if (notFound.length > 0) {
    console.log("Cards not found: ", notFound);
  }

  saveCollection();
  displayCards();

  setTimeout(function() {
    progressContainer.style.display = "none";
  }, 3000);
}
    </script>
  </body>

</html>
