<!DOCTYPE html>
<html>

  <head>
    <meta charset="UTF-8" />
    <title>My MTG Collection</title>
    <style>
      body {
        font-family: Aptos, sans-serif;
        padding: 24px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 16px;
      }

      .card {
        background: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
      }

      .card-name {
        font-weight: bold;
        margin-bottom: 4px;
      }

      .card-type {
        color: #666;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <h1>My MTG Collection</h1>
    <p>Commander card tracker — <span id="cardCount">0</span> cards in your collection</p>

    <div class="card-grid" id="cardGrid"></div>

   <input type="text" id="cardInput" placeholder="Card name..." />
   <input type="text" id="deckInput" placeholder="Deck name (e.g. Atraxa)..." />
   <button onclick="addCard()">Add card</button>

    <script>

      let collection = JSON.parse(localStorage.getItem("mtgCollection")) || [];

      function saveCollection() {
        localStorage.setItem("mtgCollection", JSON.stringify(collection));
      }

      function displayCards() {
  let grid = document.getElementById("cardGrid");
  grid.innerHTML = "";
  document.getElementById("cardCount").textContent = collection.length;

  let decks = {};
  collection.forEach(function(card, index) {
    if (!decks[card.deck]) {
      decks[card.deck] = [];
    }
    decks[card.deck].push({ card, index });
  });

  Object.keys(decks).forEach(function(deckName) {
    let deckHeader = document.createElement("h2");
    deckHeader.textContent = deckName;
    deckHeader.style.cssText = "margin-top:24px; margin-bottom:12px; font-size:18px;";
    grid.appendChild(deckHeader);

    let deckGrid = document.createElement("div");
    deckGrid.className = "card-grid";
    grid.appendChild(deckGrid);

    decks[deckName].forEach(function({ card, index }) {
      let newCard = document.createElement("div");
      newCard.className = "card";
      newCard.innerHTML = `
        <img src="${card.image}" style="width:100%; border-radius:4px;" />
        <div class="card-name">${card.name}</div>
        <div class="card-type">${card.type}</div>
        <button onclick="removeCard(${index})" style="margin-top:8px; width:100%;">Remove</button>
      `;
      deckGrid.appendChild(newCard);
    });
  });
}
      }

      async function addCard() {
        let cardName = document.getElementById("cardInput").value;

        if (cardName === "") {
          alert("Please type a card name first!");
          return;
        }

        let response = await fetch("https://api.scryfall.com/cards/named?fuzzy=" + cardName);
        let card = await response.json();

       collection.push({
          name: card.name,
          type: card.type_line,
          image: card.image_uris.normal,
          deck: document.getElementById("deckInput").value || "Unsorted"
});

        saveCollection();
        displayCards();
        document.getElementById("cardInput").value = "";
      }

      displayCards();

      function removeCard(index) {
  collection.splice(index, 1);
  saveCollection();
  displayCards();
}
    </script>
  </body>

</html>
