<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My MTG Collection</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <div class="header-top">
          <h1>Magic the Gathering - Collection Manager</h1>
          <button id="themeToggle" class="theme-toggle" title="Toggle dark mode">🌙</button>
        </div>
        <nav class="main-nav">
          <a href="#decks" class="nav-link active" id="decksLink">Decks</a>
          <a href="#boxes" class="nav-link" id="boxesLink">Collection Boxes</a>
        </nav>
        <p id="headerText"> <span id="cardCount">0</span> cards in your collection</p>
      </header>

      <section class="search-section">
        <label class="sr-only" for="searchInput">Search cards</label>
        <input
          type="text"
          id="searchInput"
          placeholder="Search by card name, type, or deck..."
        />
      </section>

      <select id="sortSelect">
  <option value="name">Sort: Name (A–Z)</option>
  <option value="type">Sort: Type</option>
  <option value="color">Sort: Color Identity</option>
  <option value="set">Sort: Set</option>
  <option value="collector">Sort: Collector Number</option>
</select>


      <section class="progress-container hidden" id="progressContainer" aria-live="polite">
        <div class="progress-text" id="progressText">Importing...</div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </section>

      <section class="controls">
        <div class="control-group">
          <h3>Add Cards</h3>
          <div class="field-group">
            <label for="cardInput">Card name</label>
            <input type="text" id="cardInput" placeholder="Card name..." />
          </div>

          <div class="field-group">
            <label for="quantityInput">Quantity</label>
            <input type="number" id="quantityInput" placeholder="1" min="1" value="1" />
          </div>

          <div class="field-group">
            <label for="foilInput">
              <input type="checkbox" id="foilInput" />
              Foil
            </label>
          </div>

          <div class="field-group">
            <label for="deckInput">Deck name</label>
            <input type="text" id="deckInput" list="deckOptions" placeholder="Deck name (e.g. Atraxa)..." />
            <datalist id="deckOptions"></datalist>
            <p class="hint-text">Choose a saved commander name or type your own deck label.</p>
          </div>

          <div class="action-row">
            <button id="addCardButton" type="button">Add card</button>
          </div>
        </div>

        <div class="control-group">
          <h3>Import & Export</h3>
          <div class="field-group">
            <label for="fileInput">Deck file</label>
            <input type="file" id="fileInput" accept=".txt" />
          </div>

          <div class="field-group">
            <label for="collectionImportInput">Collection backup</label>
            <input type="file" id="collectionImportInput" accept=".json" />
            <p class="hint-text">Import a previously exported collection backup.</p>
          </div>

          <div class="action-row">
            <button id="importDeckButton" type="button">Import deck</button>
            <button id="repairPrintsButton" type="button">Repair deck prints</button>
            <button id="exportCollectionButton" type="button">Export collection</button>
            <button id="importCollectionButton" type="button">Import backup</button>
          </div>
        </div>

        <div class="control-group">
          <h3>Filters</h3>
          <div class="field-group">
            <label for="commanderFilter">Commander legality filter</label>
            <select id="commanderFilter"></select>
          </div>

          <div class="field-group">
            <label for="deckFilter">Deck filter</label>
            <select id="deckFilter"></select>
          </div>
        </div>
      </section>

      <p class="filter-note" id="filterNote">Showing all cards.</p>
      <div class="status-message hidden" id="statusMessage" aria-live="polite"></div>
      <div class="deck-list" id="cardGrid"></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
