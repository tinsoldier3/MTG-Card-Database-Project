<!DOCTYPE html>
<html>

  <head>
    <meta charset="UTF-8" />
    <title>My MTG Collection</title>
    <style>
      body {
        font-family: Aptos, sans-serif;
        padding: 24px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 16px;
      }

      .deck-list {
        margin-top: 16px;
      }

      .deck-section + .deck-section {
        margin-top: 24px;
      }

      .card {
        background: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
      }

      .card-name {
        font-weight: bold;
        margin-bottom: 4px;
      }

      .card-type {
        color: #666;
        font-size: 14px;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-top: 24px;
        align-items: end;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-group label {
        font-size: 14px;
        color: #444;
      }

      .field-group input,
      .field-group select,
      .field-group button {
        font: inherit;
        padding: 10px 12px;
      }

      .action-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .action-row button {
        flex: 1;
        min-width: 140px;
      }

      .filter-note {
        margin-top: 12px;
        font-size: 14px;
        color: #555;
      }

      .empty-state {
        margin-top: 24px;
        color: #666;
      }

      .card-colors {
        margin-top: 6px;
        font-size: 13px;
        color: #444;
      }

      .card-controls {
        margin-top: 10px;
        display: grid;
        gap: 8px;
      }

      .card-controls input,
      .card-controls button {
        width: 100%;
        box-sizing: border-box;
      }

      .card-illegal {
        background: #fff4ef;
        border-color: #c65a3a;
      }

      .status-badge {
        display: inline-block;
        margin-top: 10px;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
      }

      .status-badge.illegal {
        background: #f7d6ca;
        color: #8f2f12;
      }

      .deck-meta {
        margin-top: -8px;
        margin-bottom: 12px;
        font-size: 14px;
        color: #666;
      }

      .hint-text {
        margin: 0;
        font-size: 12px;
        color: #666;
      }

      .status-message {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #eef6ea;
        color: #2d5a27;
        font-size: 14px;
      }

      .status-message.hidden {
        display: none;
      }

      @media (max-width: 900px) {
        .card-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 640px) {
        body {
          padding: 16px;
        }

        .card-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <h1>My MTG Collection</h1>
    <p>Commander card tracker — <span id="cardCount">0</span> cards in your collection</p>

    <div class="deck-list" id="cardGrid"></div>

    <div id="progressContainer" style="display:none; margin:16px 0;">
      <div style="font-size:14px; color:#666; margin-bottom:6px;" id="progressText">Importing...</div>
      <div style="background:#ddd; border-radius:8px; height:12px; width:100%;">
        <div id="progressBar" style="background:#4a90d9; height:12px; border-radius:8px; width:0%; transition:width 0.3s;"></div>
      </div>
    </div>

    <div class="controls">
      <div class="field-group">
        <label for="cardInput">Card name</label>
        <input type="text" id="cardInput" placeholder="Card name..." />
      </div>

      <div class="field-group">
        <label for="deckInput">Deck name</label>
        <input type="text" id="deckInput" list="deckOptions" placeholder="Deck name (e.g. Atraxa)..." />
        <datalist id="deckOptions"></datalist>
        <p class="hint-text">Choose a saved commander name or type your own deck label.</p>
      </div>

      <div class="field-group">
        <label for="fileInput">Deck file</label>
        <input type="file" id="fileInput" accept=".txt" />
      </div>

      <div class="field-group">
        <label for="commanderFilter">Commander legality filter</label>
        <select id="commanderFilter" onchange="displayCards()"></select>
      </div>

      <div class="field-group">
        <label for="deckFilter">Deck filter</label>
        <select id="deckFilter" onchange="displayCards()"></select>
      </div>

      <div class="field-group">
        <label>Actions</label>
        <div class="action-row">
          <button onclick="addCard()">Add card</button>
          <button onclick="importDeck()">Import deck</button>
        </div>
      </div>
    </div>

    <p class="filter-note" id="filterNote">Showing all cards.</p>
    <div class="status-message hidden" id="statusMessage"></div>

    <script>
const COMMANDER_DECKS = {
  "Atraxa": {
    label: "Atraxa",
    colors: ["W", "U", "B", "G"]
  },
  "Merfolk": {
    label: "Merfolk (Sygg)",
    colors: ["W", "U"]
  },
  "Timey Wimey": {
    label: "Timey Wimey (Tenth Doctor & Rose)",
    colors: ["W", "U", "R"]
  },
  "Bumi Unleashed": {
    label: "Bumi Unleashed",
    colors: ["R", "G"]
  },
  "Counter Intelligence": {
    label: "Counter Intelligence (Inspirit)",
    colors: ["W", "U", "R"]
  },
  "Chishiro": {
    label: "Chishiro",
    colors: ["R", "G"]
  },
  "Ashling Flame Dancer": {
    label: "Ashling Flame Dancer",
    colors: ["R"]
  },
  "Play for Free": {
    label: "Play for Free (Ellie and Alan)",
    colors: ["W", "U", "G"]
  },
  "Food and Fellowship": {
    label: "Food and Fellowship (Frodo & Sam)",
    colors: ["W", "B", "G"]
  },
  "Shalai and Hallar": {
    label: "Shalai and Hallar",
    colors: ["W", "R", "G"]
  }
};

const DECK_NAME_ALIASES = {
  "atraxa": "Atraxa",
  "atraxa (praetors' voice)": "Atraxa",
  "merfolk": "Merfolk",
  "merfolk (sygg)": "Merfolk",
  "sygg": "Merfolk",
  "timey wimey": "Timey Wimey",
  "timey wimey (tenth doctor & rose)": "Timey Wimey",
  "tenth doctor & rose": "Timey Wimey",
  "bumi unleashed": "Bumi Unleashed",
  "counter intelligence": "Counter Intelligence",
  "counter intelligence (inspirit)": "Counter Intelligence",
  "inspirit": "Counter Intelligence",
  "chishiro": "Chishiro",
  "ashling": "Ashling Flame Dancer",
  "ashling flame dancer": "Ashling Flame Dancer",
  "play for free": "Play for Free",
  "play for free (ellie and alan)": "Play for Free",
  "ellie and alan": "Play for Free",
  "food and fellowship": "Food and Fellowship",
  "food and fellowship (frodo & sam)": "Food and Fellowship",
  "frodo & sam": "Food and Fellowship",
  "shalai and hallar": "Shalai and Hallar"
};

const COLOR_NAMES = {
  W: "White",
  U: "Blue",
  B: "Black",
  R: "Red",
  G: "Green"
};

let collection = (JSON.parse(localStorage.getItem("mtgCollection")) || []).map(normalizeStoredCard);

function saveCollection() {
  localStorage.setItem("mtgCollection", JSON.stringify(collection));
}

function normalizeStoredCard(card) {
  return {
    ...card,
    deck: normalizeDeckName(card.deck || "Unsorted"),
    colorIdentity: Array.isArray(card.colorIdentity) ? card.colorIdentity : []
  };
}

function normalizeDeckName(deckName) {
  let trimmedName = (deckName || "").trim();
  if (!trimmedName) {
    return "Unsorted";
  }

  let aliasKey = trimmedName.toLowerCase();
  if (DECK_NAME_ALIASES[aliasKey]) {
    return DECK_NAME_ALIASES[aliasKey];
  }

  let matchedAlias = Object.keys(DECK_NAME_ALIASES).find(function(alias) {
    return aliasKey.includes(alias);
  });

  return matchedAlias ? DECK_NAME_ALIASES[matchedAlias] : trimmedName;
}

function populateCommanderFilter() {
  let filter = document.getElementById("commanderFilter");
  let deckOptions = document.getElementById("deckOptions");
  filter.innerHTML = "";
  deckOptions.innerHTML = "";

  let allOption = document.createElement("option");
  allOption.value = "";
  allOption.textContent = "All cards";
  filter.appendChild(allOption);

  Object.keys(COMMANDER_DECKS).forEach(function(deckName) {
    let filterOption = document.createElement("option");
    filterOption.value = deckName;
    filterOption.textContent = COMMANDER_DECKS[deckName].label;
    filter.appendChild(filterOption);

    let deckOption = document.createElement("option");
    deckOption.value = deckName;
    deckOptions.appendChild(deckOption);
  });
}

function populateDeckFilter() {
  let deckFilter = document.getElementById("deckFilter");
  let selectedValue = deckFilter.value;
  let deckNames = Array.from(new Set(collection.map(function(card) {
    return normalizeDeckName(card.deck || "Unsorted");
  }))).sort(function(a, b) {
    return a.localeCompare(b);
  });

  deckFilter.innerHTML = "";

  let allOption = document.createElement("option");
  allOption.value = "";
  allOption.textContent = "All decks";
  deckFilter.appendChild(allOption);

  deckNames.forEach(function(deckName) {
    let option = document.createElement("option");
    option.value = deckName;
    option.textContent = COMMANDER_DECKS[deckName] ? COMMANDER_DECKS[deckName].label : deckName;
    deckFilter.appendChild(option);
  });

  if (deckNames.includes(selectedValue)) {
    deckFilter.value = selectedValue;
  } else {
    deckFilter.value = "";
  }
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getDeckDisplayLabel(deckName) {
  return COMMANDER_DECKS[deckName] ? COMMANDER_DECKS[deckName].label : deckName;
}

let statusMessageTimeout;

function showStatusMessage(message) {
  let statusMessage = document.getElementById("statusMessage");
  statusMessage.textContent = message;
  statusMessage.classList.remove("hidden");

  clearTimeout(statusMessageTimeout);
  statusMessageTimeout = setTimeout(function() {
    statusMessage.classList.add("hidden");
  }, 2500);
}

function getColorIdentityLabel(colors) {
  if (!colors || colors.length === 0) {
    return "Colorless";
  }

  return colors.map(function(color) {
    return COLOR_NAMES[color] || color;
  }).join(", ");
}

function isCardLegalForCommander(card, commanderName) {
  if (!commanderName) {
    return true;
  }

  let commander = COMMANDER_DECKS[normalizeDeckName(commanderName)];
  let commanderColors = commander ? commander.colors : null;
  if (!commanderColors || !Array.isArray(card.colorIdentity)) {
    return true;
  }

  return card.colorIdentity.every(function(color) {
    return commanderColors.includes(color);
  });
}

function getDeckLegality(card) {
  let deckName = normalizeDeckName(card.deck || "Unsorted");
  let hasKnownCommander = Boolean(COMMANDER_DECKS[deckName]);

  if (!hasKnownCommander) {
    return {
      checked: false,
      legal: true
    };
  }

  return {
    checked: true,
    legal: isCardLegalForCommander(card, deckName)
  };
}

function getDeckInputId(index) {
  return "deckEdit-" + index;
}

function displayCards() {
  let grid = document.getElementById("cardGrid");
  let filterNote = document.getElementById("filterNote");
  let selectedCommander = document.getElementById("commanderFilter").value;
  let selectedDeck = document.getElementById("deckFilter").value;
  let visibleCount = 0;
  grid.innerHTML = "";

  if (selectedCommander && selectedDeck) {
    let deckLabel = getDeckDisplayLabel(selectedDeck);
    filterNote.textContent = "Showing cards in " + deckLabel + " that are legal in " + selectedCommander + ".";
  } else if (selectedCommander) {
    filterNote.textContent = "Showing cards legal in " + selectedCommander + ".";
  } else if (selectedDeck) {
    let deckLabel = getDeckDisplayLabel(selectedDeck);
    filterNote.textContent = "Showing cards in " + deckLabel + ".";
  } else {
    filterNote.textContent = "Showing all cards.";
  }

  let decks = {};
  collection.forEach(function(card, index) {
    let deckName = normalizeDeckName(card.deck || "Unsorted");

    if (selectedDeck && deckName !== selectedDeck) {
      return;
    }

    if (!isCardLegalForCommander(card, selectedCommander)) {
      return;
    }

    visibleCount += 1;
    if (!decks[deckName]) {
      decks[deckName] = [];
    }
    decks[deckName].push({ card, index });
  });

  let deckNames = Object.keys(decks);
  let countLabel = selectedCommander
    || selectedDeck
    ? visibleCount + " of " + collection.length
    : collection.length;
  document.getElementById("cardCount").textContent = countLabel;

  if (deckNames.length === 0) {
    let emptyState = document.createElement("p");
    emptyState.className = "empty-state";
    emptyState.textContent = selectedCommander || selectedDeck
      ? "No cards match the current filters."
      : "No cards in your collection yet.";
    grid.appendChild(emptyState);
    return;
  }

  deckNames.sort(function(a, b) {
    return a.localeCompare(b);
  });

  deckNames.forEach(function(deckName) {
    let deckSection = document.createElement("section");
    deckSection.className = "deck-section";

    let illegalCount = decks[deckName].filter(function(entry) {
      let legality = getDeckLegality(entry.card);
      return legality.checked && !legality.legal;
    }).length;

    let deckHeader = document.createElement("h2");
    deckHeader.textContent = deckName + " (" + decks[deckName].length + " cards)";
    deckHeader.style.cssText = "margin-top:24px; margin-bottom:12px; font-size:18px;";
    deckSection.appendChild(deckHeader);

    if (COMMANDER_DECKS[deckName]) {
      let deckMeta = document.createElement("p");
      deckMeta.className = "deck-meta";
      deckMeta.textContent = illegalCount > 0
        ? illegalCount + " card" + (illegalCount === 1 ? "" : "s") + " outside this commander's color identity."
        : "All visible cards match this commander's color identity.";
      deckSection.appendChild(deckMeta);
    }

    let deckGrid = document.createElement("div");
    deckGrid.className = "card-grid";
    deckSection.appendChild(deckGrid);

    decks[deckName].sort(function(a, b) {
      return a.card.name.localeCompare(b.card.name);
    });

    decks[deckName].forEach(function({ card, index }) {
      let newCard = document.createElement("div");
      let legality = getDeckLegality(card);
      let deckInputId = getDeckInputId(index);
      let safeCardName = escapeHtml(card.name);
      let safeTypeLine = escapeHtml(card.type);
      let safeDeckName = escapeHtml(card.deck || "Unsorted");
      newCard.className = legality.checked && !legality.legal ? "card card-illegal" : "card";
      newCard.innerHTML = `
        <img src="${card.image}" style="width:100%; border-radius:4px;" />
        <div class="card-name">${safeCardName}</div>
        <div class="card-type">${safeTypeLine}</div>
        <div class="card-colors">Color identity: ${getColorIdentityLabel(card.colorIdentity)}</div>
        ${legality.checked && !legality.legal ? '<div class="status-badge illegal">Illegal for this deck</div>' : ""}
        <div class="card-controls">
          <input type="text" id="${deckInputId}" list="deckOptions" value="${safeDeckName}" aria-label="Deck name for ${safeCardName}" />
          <button onclick="updateCardDeck(${index})">Move to deck</button>
          <button onclick="removeCard(${index})">Remove</button>
        </div>
      `;
      deckGrid.appendChild(newCard);
    });

    grid.appendChild(deckSection);
  });
}

async function addCard() {
  let cardName = document.getElementById("cardInput").value;
  let deckName = normalizeDeckName(document.getElementById("deckInput").value);

  if (cardName === "") {
    alert("Please type a card name first!");
    return;
  }

  let response = await fetch("https://api.scryfall.com/cards/named?fuzzy=" + cardName);
  let card = await response.json();

  let imageUri = card.image_uris
    ? card.image_uris.normal
    : card.card_faces[0].image_uris.normal;

  collection.push({
    name: card.name,
    type: card.type_line,
    image: imageUri,
    deck: deckName,
    colorIdentity: card.color_identity || []
  });

  saveCollection();
  populateDeckFilter();
  displayCards();
  document.getElementById("cardInput").value = "";
  showStatusMessage(card.name + " added to " + getDeckDisplayLabel(deckName) + ".");

  if (COMMANDER_DECKS[deckName]) {
    document.getElementById("commanderFilter").value = deckName;
    displayCards();
  }
}

function removeCard(index) {
  let removedCardName = collection[index].name;
  collection.splice(index, 1);
  saveCollection();
  populateDeckFilter();
  displayCards();
  showStatusMessage(removedCardName + " removed.");
}

function updateCardDeck(index) {
  let input = document.getElementById(getDeckInputId(index));
  if (!input) {
    return;
  }

  let nextDeckName = normalizeDeckName(input.value);
  let previousDeckName = collection[index].deck || "Unsorted";
  collection[index].deck = nextDeckName;
  saveCollection();
  populateDeckFilter();
  displayCards();
  showStatusMessage(collection[index].name + " moved from " + getDeckDisplayLabel(previousDeckName) + " to " + getDeckDisplayLabel(nextDeckName) + ".");
}

async function refreshMissingColorIdentities() {
  let missingCards = collection.filter(function(card) {
    return !Array.isArray(card.colorIdentity) || card.colorIdentity.length === 0;
  });

  if (missingCards.length === 0) {
    return;
  }

  let uniqueNames = Array.from(new Set(missingCards.map(function(card) {
    return card.name;
  })));

  let identifiers = uniqueNames.map(function(name) {
    return { name: name };
  });

  for (let i = 0; i < identifiers.length; i += 75) {
    let chunk = identifiers.slice(i, i + 75);

    try {
      let response = await fetch("https://api.scryfall.com/cards/collection", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ identifiers: chunk })
      });

      let data = await response.json();
      let colorMap = {};

      (data.data || []).forEach(function(card) {
        colorMap[card.name] = card.color_identity || [];
      });

      collection = collection.map(function(card) {
        if (colorMap[card.name]) {
          return {
            ...card,
            colorIdentity: colorMap[card.name]
          };
        }

        return card;
      });
    } catch (error) {
      console.error("Unable to refresh color identities.", error);
      return;
    }
  }

  saveCollection();
  populateDeckFilter();
  displayCards();
}

populateCommanderFilter();
saveCollection();
populateDeckFilter();
displayCards();
refreshMissingColorIdentities();

async function importDeck() {
  let deckName = normalizeDeckName(document.getElementById("deckInput").value);

  if (!deckName) {
    alert("Please type a deck name before importing!");
    return;
  }

  let file = document.getElementById("fileInput").files[0];

  if (!file) {
    alert("Please select a txt file first!");
    return;
  }

  let text = await file.text();
  let lines = text.split("\n");

  let inMaybeboard = false;
  let cardLines = lines.filter(function(line) {
    let trimmed = line.trim();
    if (trimmed.startsWith("// MAYBEBOARD")) {
      inMaybeboard = true;
    }
    if (trimmed === "" || trimmed.startsWith("// ") || trimmed.startsWith("//")) return false;
    if (inMaybeboard) return false;
    return true;
  });

  let identifiers = [];
  cardLines.forEach(function(line) {
    if (line.includes("{noDeck}")) return;
    let isFoil = line.includes("*F*");
    let cleaned = line.replace(/\*F\*/g, "").replace(/\[.*?\]/g, "").trim();
    let match = cleaned.match(/^(\d+)x?\s+(.+?)\s+\([a-zA-Z0-9]+\)/);
    if (match) {
      let quantity = parseInt(match[1]);
      let cardName = match[2].trim();
      for (let i = 0; i < quantity; i++) {
        identifiers.push({ name: cardName, foil: isFoil });
      }
    }
  });

  let chunks = [];
  for (let i = 0; i < identifiers.length; i += 75) {
    chunks.push(identifiers.slice(i, i + 75));
  }

  let progressContainer = document.getElementById("progressContainer");
  let progressBar = document.getElementById("progressBar");
  let progressText = document.getElementById("progressText");

  progressContainer.style.display = "block";
  progressBar.style.width = "0%";
  progressText.textContent = "Starting import of " + identifiers.length + " cards into " + deckName + "...";

  let allCards = [];
  let notFound = [];
  let processed = 0;

  for (let chunk of chunks) {
    let response = await fetch("https://api.scryfall.com/cards/collection", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ identifiers: chunk })
    });

    let data = await response.json();
    allCards = allCards.concat(data.data);

    if (data.not_found) {
      notFound = notFound.concat(data.not_found);
    }

    processed += chunk.length;
    let percent = Math.round((processed / identifiers.length) * 100);
    progressBar.style.width = percent + "%";
    progressText.textContent = "Imported " + processed + " of " + identifiers.length + " cards...";

    await new Promise(r => setTimeout(r, 200));
  }

  allCards.forEach(function(card) {
    let imageUri = card.image_uris
      ? card.image_uris.normal
      : card.card_faces[0].image_uris.normal;

    let identifier = identifiers.find(id => id.name === card.name);
    collection.push({
      name: card.name,
      type: card.type_line,
      image: imageUri,
      deck: deckName,
      foil: identifier ? identifier.foil : false,
      colorIdentity: card.color_identity || []
    });
  });

  progressText.textContent = notFound.length > 0
    ? "Import complete! " + allCards.length + " cards added. " + notFound.length + " not found."
    : "Import complete! All " + allCards.length + " cards added to " + deckName + ".";
  progressBar.style.width = "100%";

  if (notFound.length > 0) {
    console.log("Cards not found: ", notFound);
  }

  saveCollection();
  populateDeckFilter();
  displayCards();
  showStatusMessage(allCards.length + " cards imported to " + getDeckDisplayLabel(deckName) + ".");

  setTimeout(function() {
    progressContainer.style.display = "none";
  }, 3000);
}
    </script>
  </body>

</html>
