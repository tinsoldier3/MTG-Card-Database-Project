<!DOCTYPE html>
<html>

  <head>
    <title>My MTG Collection</title>
    <style>
      body {
        font-family: Georgia, sans-serif;
        padding: 24px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 16px;
      }

      .card {
        background: #e8f4e8;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
      }

      .card-name {
        font-weight: bold;
        margin-bottom: 4px;
      }

      .card-type {
        color: #666;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <h1>My MTG Collection</h1>
    <p>Commander card tracker</p>

    <div class="card-grid" id="cardGrid">

      <div class="card">
        <div class="card-name">Sol Ring</div>
        <div class="card-type">Artifact</div>
      </div>

      <div class="card">
        <div class="card-name">Command Tower</div>
        <div class="card-type">Land</div>
      </div>

      <div class="card">
        <div class="card-name">Arcane Signet</div>
        <div class="card-type">Artifact</div>
      </div>

    </div>
    <input type="text" id="cardInput" placeholder="Card name..." />
<button onclick="addCard()">Add card</button>

<script>
  function addCard() {
    
    let cardName = document.getElementById("cardInput").value;

    if (cardName === "") {
      alert("Please type a card name first!");
      return;
    }

    let grid = document.getElementById("cardGrid");

    let newCard = document.createElement("div");
    newCard.className = "card";
    newCard.innerHTML = "<div class='card-name'>" + cardName + "</div>";

    grid.appendChild(newCard);

    document.getElementById("cardInput").value = "";
  }
</script>
  </body>

</html>
